gap            = 8
border         = 2
insert_bind_limit = 100
normal_bind_limit = 24
command_limit = 10
autostart_limit = 4
bar_enabled    = true
bar_height     = 24
bar_position   = bottom
external_bar_height = auto
border_focus   = 7aa2f7
border_normal  = 2f3549
bar_bg         = 1a1b26
bar_fg         = c0caf5
bar_accent_bg  = 7aa2f7
bar_accent_fg  = 1a1b26
bar_muted_fg   = 565f89
bar_font       = Liberation Mono:size=8
bar_left       = command,workspaces,title
bar_center     = 
bar_right      = tray,battery,clock
screen_off_minutes = 0
# Do not generate mouse motion when changing workspace/focus; important for games.
warp_pointer = false

# Re-apply the wallpaper whenever the monitor layout/size changes (plug/unplug),
# since X invalidates the root pixmap on every framebuffer resize.
monitor_hook = ~/.local/bin/nvwm-wallpaper set

# Autostart commands
# Optional: set this above 0 to turn the monitor off after that many idle minutes.
# Example: screen_off_minutes = 10
autostart = ~/.local/bin/nvwm-wallpaper set
# Start each session with an empty voice-assistant conversation.
autostart = /home/gentoobdw/jarvis/jarvis.sh --reset
#autostart = env QT_QPA_PLATFORM=xcb quickshell -p ~/.config/quickshell-nvwm/Shell.qml --daemonize
# Optional external bar setup:
# - set `bar_enabled = false` to disable the built-in NVWM bar
# - set `external_bar_height` if you want NVWM to reserve layout space for it
# - keep `bar_position` matching the external bar position
# Example:
# bar_enabled = false
# bar_position = top
# external_bar_height = auto
#autostart = polybar
# NVWM does not require picom. Leave all compositor lines commented if you want no compositor.
# Uncomment only one compositor line below, and only after you have installed that exact picom build.
# If you uncomment a line for a binary that does not exist on your system, that autostart command will fail.
# `picom` is the standard distro package.
# `/home/gentoobdw/opt/picom-pijulius/bin/picom` is the local install path for the pijulius fork on this system.
# `/home/gentoobdw/opt/picom-ftlabs/bin/picom` is the example local install path for the FT-Labs fork.
# Do not enable multiple compositor lines at the same time.
autostart = picom --config ~/.config/nvwm/picom.conf
#autostart = /home/gentoobdw/opt/picom-pijulius/bin/picom --config ~/.config/nvwm/picom.conf
#autostart = ~/opt/picom-ftlabs/bin/picom # --config ~/.config/nvwm/picom.conf

# Window rules
# rule = class:Librewolf = workspace:2
# rule = class:Pavucontrol = float
# rule = title:Open File = float

# INSERT mode - Super-based keybinds
bind_insert = mod+q = spawn:alacritty
bind_insert = mod+shift+q = wm:quit
bind_insert = mod+Space = spawn:rofi -show drun
# Voice assistant: hold, wait for the beep, speak, release.
bind_insert = mod+a = spawn:/home/gentoobdw/jarvis/jarvis.sh
bind_insert = Print = wm:screenshot
bind_insert = mod+c = wm:kill
bind_insert = mod+Escape = wm:mode:normal
bind_insert = mod+Tab = wm:focus_next
bind_insert = mod+f = wm:toggle_fullscreen
bind_insert = mod+v = wm:toggle_float_centered
bind_insert = mod+n = spawn:~/.local/bin/nvwm-wallpaper next
bind_insert = mod+m = spawn:~/.local/bin/nvwm-wallpaper prev
# move (swap) focused window in a direction - Hyprland: Super+Shift+arrows
bind_insert = mod+shift+Left = wm:swap_left
bind_insert = mod+shift+Right = wm:swap_right
bind_insert = mod+shift+Up = wm:swap_up
bind_insert = mod+shift+Down = wm:swap_down
bind_insert = mod+ctrl+Left = wm:swap_left
bind_insert = mod+ctrl+Right = wm:swap_right
bind_insert = mod+ctrl+Up = wm:swap_up
bind_insert = mod+ctrl+Down = wm:swap_down
# move focus in a direction (Hyprland-style) - Super+arrows / Super+h,l
bind_insert = mod+Left = wm:focus_left
bind_insert = mod+Right = wm:focus_right
bind_insert = mod+Up = wm:focus_up
bind_insert = mod+Down = wm:focus_down
bind_insert = mod+h = wm:focus_left
bind_insert = mod+l = wm:focus_right
bind_insert = mod+j = wm:ratio:-0.05
bind_insert = mod+k = wm:ratio:+0.05
bind_insert = mod+F1 = spawn:playerctl play-pause
bind_insert = mod+F2 = spawn:playerctl previous
bind_insert = mod+F3 = spawn:playerctl next
bind_insert = mod+F5 = spawn:brightnessctl set 10%-
bind_insert = mod+F6 = spawn:brightnessctl set +10%
bind_insert = mod+Page_Up = wm:workspace_prev
bind_insert = mod+Page_Down = wm:workspace_next
bind_insert = mod+ctrl+Page_Up = wm:move_to_workspace_prev
bind_insert = mod+ctrl+Page_Down = wm:move_to_workspace_next
bind_insert = mod+1 = wm:workspace:1
bind_insert = mod+2 = wm:workspace:2
bind_insert = mod+3 = wm:workspace:3
bind_insert = mod+4 = wm:workspace:4
bind_insert = mod+5 = wm:workspace:5
bind_insert = mod+6 = wm:workspace:6
bind_insert = mod+7 = wm:workspace:7
bind_insert = mod+8 = wm:workspace:8
bind_insert = mod+9 = wm:workspace:9
bind_insert = mod+ctrl+1 = wm:move_to_workspace:1
bind_insert = mod+ctrl+2 = wm:move_to_workspace:2
bind_insert = mod+ctrl+3 = wm:move_to_workspace:3
bind_insert = mod+ctrl+4 = wm:move_to_workspace:4
bind_insert = mod+ctrl+5 = wm:move_to_workspace:5
bind_insert = mod+ctrl+6 = wm:move_to_workspace:6
bind_insert = mod+ctrl+7 = wm:move_to_workspace:7
bind_insert = mod+ctrl+8 = wm:move_to_workspace:8
bind_insert = mod+ctrl+9 = wm:move_to_workspace:9

# NORMAL mode - keys execute instantly
bind_normal = i = wm:mode:insert
bind_normal = j = wm:focus_down
bind_normal = k = wm:focus_up
# NORMAL COMMAND mode: (type :command and press Enter)
command = :q! = wm:quit
command = :w! = wm:reload
command = :wall = spawn:~/.local/bin/nvwm-wallpaper next

# Optional volume / media / brightness keys
 bind_insert = XF86AudioRaiseVolume = spawn:pactl set-sink-volume @DEFAULT_SINK@ +5%
 bind_insert = XF86AudioLowerVolume = spawn:pactl set-sink-volume @DEFAULT_SINK@ -5%
 bind_insert = XF86AudioMute = spawn:pactl set-sink-mute @DEFAULT_SINK@ toggle
 bind_insert = XF86AudioPlay = spawn:playerctl play-pause
 bind_insert = XF86AudioNext = spawn:playerctl next
 bind_insert = XF86AudioPrev = spawn:playerctl previous
 bind_insert = XF86MonBrightnessUp = spawn:brightnessctl set +10%
 bind_insert = XF86MonBrightnessDown = spawn:brightnessctl set 10%-

# reload the freshly-installed binary live (no logout)
bind_insert = mod+shift+r = wm:restart
command = :restart = wm:restart
